console_title_template = '{{ .Shell }} in {{ .Folder }}'
version = 3
final_space = true

[[blocks]]
    type = 'prompt'
    alignment = 'left'

    [[blocks.segments]]
        type = 'path'
        style = 'plain'
        background = 'transparent'
        foreground = 'blue'
        template = '{{ .Path }}'

    [blocks.segments.properties]
        style = 'full'

    [[blocks.segments]]
        type = "python"
        style = "plain"
        foreground = 'yellow'
        background = 'transparent'
        template = "   {{ .Full }} "

    [[blocks.segments]]
        type = 'git'
        style = 'plain'
        foreground = 'yellow'
        background = 'transparent'
        template = ' <red></><yellow> {{ .HEAD }}</><red>{{ if or (.Working.Changed) (.Staging.Changed) }} *{{ end }}</><green>{{ if gt .Behind 0 }} {{ end }}</><red>{{ if gt .Ahead 0 }} {{ end }}</>'

        [blocks.segments.properties]
            branch_icon = ''
            commit_icon = '@'
            fetch_status = true

[[blocks]]
    type = 'prompt'
    overflow = 'hidden'
    alignment = 'right'

    [[blocks.segments]]
        type = 'kubectl'
        style = 'plain'
        template = ' <blue>󱃾 </>{{ if or (regexMatch "(?i)prod" .Context) (regexMatch "(?i)prod" .Env.KUBECONFIG) }}<b><red>{{.Context}}</></b>{{ else }}<green>{{.Context}}</>{{ end }}{{if .Namespace}}<darkGray>::</><blue>{{.Namespace}}{{end}}</> '

[[blocks]]
    type = 'rprompt'
    overflow = 'hidden'

    [[blocks.segments]]
        type = 'executiontime'
        style = 'plain'
        background = 'transparent'
        foreground = 'yellow'
        template = '{{ .FormattedMs }} '

        [blocks.segments.properties]
        threshold = 2

[[blocks]]
    type = 'prompt'
    alignment = 'left'
    newline = true

    [[blocks.segments]]
        type = 'text'
        style = 'plain'
        foreground_templates = [
            '{{if gt .Code 0}}red{{end}}',
            '{{if eq .Code 0}}green{{end}}'
        ]
        background = 'transparent'
        template = '$'

[transient_prompt]
    background = 'transparent'
    foreground_templates = [
        '{{if gt .Code 0}}red{{end}}',
        '{{if eq .Code 0}}green{{end}}'
    ]
    template = '$ '

[secondary_prompt]
    background = 'transparent'
    foreground = 'yellow'
    template = '$$ '
