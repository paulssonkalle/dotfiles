set-option -g default-terminal "screen-256color"
set-option -a terminal-features 'xterm-256color:RGB'

# Remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Clear screen with <prefix> + l
bind C-l send-keys 'C-l'

# Stay in tmux when session closes
set -g detach-on-destroy off

# Split panes using | and -
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
unbind '"'
unbind %

# Disable prompting on exit window and exit pane
bind-key & kill-window
bind-key x kill-pane

# Start window numbers from 1
set-option -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Don't rename windows automatically
set-option -g allow-rename off

# Reload config with prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# Send "source ~/.zshrc<Enter>" to all panes in *current* session
bind  Z  run 'panes=`tmux list-panes -s -F "##{pane_id}"`; \
              for pane in $panes; do \
                tmux send -t $pane "source ~/.zshrc" Enter; \
                tmux send -t $pane "source ~/.zshenv" Enter; \
              done'

# Enable mouse support
set -g mouse on

bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf --tmux 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

bind-key "A" display-popup -E -w 60% -h 50% "worktree interactive-add"

# List of plugins
set -g @tpm_plugins ' \
tmux-plugins/tpm \
tmux-plugins/tmux-sensible \
christoomey/vim-tmux-navigator \
tmux-plugins/tmux-resurrect \
tmux-plugins/tmux-yank \
vaaleyard/tmux-dotbar \
tmux-plugins/tmux-continuum \
'

set -g status-style fg=default,bg=default
set -g popup-style default
set -g popup-border-style default
set -g menu-style default
set -g status-right " "
set -g status-left-length 150
set -g @tmux-dotbar-bg default
set -g @tmux-dotbar-fg "brightblack"
set -g @tmux-dotbar-fg-current "green"
set -g @tmux-dotbar-fg-prefix "red"
set -g @tmux-dotbar-fg-session "green"
set -g @tmux-dotbar-session-text "[#S]"
set -g @tmux-dotbar-window-status-format " #{window_index}:#W "

# Tmux yank settings
set -g @override_copy_command 'wl-copy'
set -g @yank_selection 'clipboard'
set -g @yank_selection_mouse 'clipboard'
set -g @yank_action 'copy-pipe'

# Tmux continuum
set -g @continuum-save-interval '0'

run '~/.config/tmux/plugins/tpm/tpm'
