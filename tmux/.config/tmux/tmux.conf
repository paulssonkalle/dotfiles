set-option -g default-terminal "tmux-256color"
set-option -as terminal-features ',xterm*:RGB'

# Remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Clear screen with <prefix> + l
bind C-l send-keys 'C-l'

# Never pass a kubeconfig to new sessions; pick one per shell with kc
set-environment -gu KUBECONFIG

# Stay in tmux when session closes
set -g detach-on-destroy off

# Split panes using | and -
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
unbind '"'
unbind %

# Disable prompting on exit window and exit pane
bind-key & kill-window
bind-key x kill-pane

# Start window numbers from 1
set-option -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Don't rename windows automatically
set-option -g allow-rename off

# Reload config with prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# Send "source ~/.zshrc<Enter>" to all panes in *current* session
bind  Z  run 'panes=`tmux list-panes -s -F "##{pane_id}"`; \
              for pane in $panes; do \
                tmux send -t $pane "source ~/.zshrc" Enter; \
                tmux send -t $pane "source ~/.zprofile" Enter; \
              done'

# Enable mouse support
set -g mouse on

bind-key "T" run-shell "sel=\"$(
  sesh list --icons | fzf --tmux 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\"; [ -n \"\$sel\" ] && sesh connect \"\$sel\"; true"

bind-key "A" display-popup -E -w 60% -h 50% "worktree interactive-add"

# List of plugins
set -g @tpm_plugins ' \
tmux-plugins/tpm \
tmux-plugins/tmux-sensible \
christoomey/vim-tmux-navigator \
tmux-plugins/tmux-resurrect \
tmux-plugins/tmux-yank \
vaaleyard/tmux-dotbar \
tmux-plugins/tmux-continuum \
'

set -g status-style fg=default,bg=default
set -g popup-style default
set -g popup-border-style default
set -g menu-style default
set -g pane-border-style fg=brightblack
set -g pane-active-border-style "fg=#{?pane_modal_flag,blue,#{?pane_marked,magenta,#{?synchronize-panes,red,#{?pane_in_mode,yellow,green}}}}"

# Use terminal ANSI colors instead of tmux's built-in theme* palette.
# Highlights use theme* colors so tmux picks Everforest's pale backgrounds in light mode.
# themewhite is repurposed as the selection background.
# Values are Everforest bg_visual/bg_yellow/bg_blue/bg_purple (dark soft, light hard) with fg as text.
set -g dark-theme-black "#d3c6aa"
set -g dark-theme-white "#5c3f4f"
set -g dark-theme-yellow "#55544a"
set -g dark-theme-cyan "#3f5865"
set -g dark-theme-magenta "#4e4953"
set -g light-theme-black "#5c6a72"
set -g light-theme-white "#f0f2d4"
set -g light-theme-yellow "#fef2d5"
set -g light-theme-cyan "#ecf5ed"
set -g light-theme-magenta "#fceced"
set -g message-style "bg=themeyellow,fg=themeblack,#{?#{m/r:(^|#,)IS(PANE|MODE)($|#,),#{prompt_flags}},,fill=themeyellow}"
set -g message-command-style "bg=black,fg=yellow,#{?#{m/r:(^|#,)IS(PANE|MODE)($|#,),#{prompt_flags}},,fill=black}"
set -g menu-selected-style bg=themewhite,fg=themeblack
set -g menu-border-style fg=brightblack
set -g mode-style noattr,bg=themewhite,fg=themeblack
set -g clock-mode-colour blue
set -g display-panes-active-colour red
set -g display-panes-colour blue
set -g display-panes-border-style fg=brightblack
set -g copy-mode-match-style bg=themecyan,fg=themeblack
set -g copy-mode-current-match-style bg=thememagenta,fg=themeblack
set -g copy-mode-mark-style bg=themeyellow,fg=themeblack
set -g copy-mode-current-line-number-style fg=yellow
set -g copy-mode-line-number-style fg=brightblack,dim
set -g fill-character "#{?is_inside,#[bg=black] ,#[fg=brightblack]#[acs]~}"
set -g pane-scrollbars-style bg=black,fg=brightblack,width=1,pad=0
set -g tree-mode-border-style fg=brightblack
set -g tree-mode-preview-style "fg=#{?#{||:#{&&:#{pane_format},#{pane_active}},#{&&:#{window_format},#{window_active}}},red,blue}"
set -g status-right " "
set -g status-left-length 150
set -g @tmux-dotbar-bg default
set -g @tmux-dotbar-fg "brightblack"
set -g @tmux-dotbar-fg-current "green"
set -g @tmux-dotbar-fg-prefix "red"
set -g @tmux-dotbar-fg-session "green"
set -g @tmux-dotbar-session-text "[#S]"
set -g @tmux-dotbar-window-status-format " #{window_index}:#W "

# Tmux yank settings
set -g @override_copy_command 'pbcopy'
set -g @yank_selection 'clipboard'
set -g @yank_selection_mouse 'clipboard'
set -g @yank_action 'copy-pipe'

# Tmux continuum
set -g @continuum-save-interval '0'

run '~/.config/tmux/plugins/tpm/tpm'
